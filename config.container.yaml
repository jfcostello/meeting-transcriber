paths:
  input: /data/input
  output: /data/output
  state: /data/state

timezone: America/Toronto

worker:
  poll_seconds: 5
  stable_seconds: 30
  retry_delays_seconds: [60, 300, 1800, 7200]

transcription:
  model: ${WHISPER_MODEL}
  device: cuda
  compute_type: int8_float16
  batch_size: 8
  language:
  min_speakers:
  max_speakers:
  diarization_model: pyannote/speaker-diarization-community-1
  hf_token_env: HF_TOKEN

summary:
  enabled: false
  provider: openai_compatible
  base_url:
  model:
