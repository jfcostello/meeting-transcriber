# Input folder, the one where your video and audio files are placed that you wish to be transcribed and summarized
meeting_recordings_folder: "meeting_recording_queue/Easy_Voice_Recorder"

# Output folder configuration, where you want the final output and original files to be saved
# Base folder is he primary folder where summaries will be saved and copies of the original files will be placed
# Structure is an optional list of sub folders which will be created within the base folder. Date is date in YYYY-MM-DD format, file-name is the name of the original file, and summary-type is the folder the file was originally placed in. You can choose none, some or all and put them in any order. If none, everything will be saved in the base folder.
# You can nest sub folders infinitely deep within the base folder, so long as there is a summary-rules.txt file in the folder it will be picked up and converted. Only the folder the file is in will be used for the output folder summary-type.
output_structure:
  base_folder: "summaries" 
  structure: ["DATE", "SUMMARY-TYPE", "FILE-NAME"]  # Options: DATE, FILE-NAME, SUMMARY-TYPE, placed in quotation marks, seperated by commas

# Enables additional console logging, set to 'true' to enable
logging:
  enabled: true

# You can use 'anthropic' 'openai' 'groq' 'gemini' or 'replicate', any model there will do. You can also use OpenAIs API endpoint for local models by setting client_type to local_openai
llm:
#  model: "gemini-exp-1206"
#  client_type: gemini
#  model: "gpt-4o-2024-11-20"
#  client_type: openai
  model: "claude-3-5-sonnet-20241022"
  client_type: anthropic
  max_tokens: 8192
  temperature: 1

# Setting to modify the name of the file after it processes it to add a timestamp which can keep your outpout folders organized
add_timestamp: false

# Transcription Engine Configuration
transcription_engine: "whisperx"  # Options: "whisper", "faster_whisper", faster_whisper can be useful for larger files and/or if you don't have a GPU

# Whisper settings, if you're using Whisoer
whisper:
  model: "turbo"
  language: "en"  # Set to a specific language code or "auto" for automatic detection
  device: "auto"    # Options: "auto", "cpu", "cuda"
  batch_size: "auto"  # "auto" or an integer
  use_fp16: "auto"    # "auto", true, or false
  segment_length: "auto"  # "auto" or an integer (seconds)

# Faster Whisper Settings, if you're ussing faster_whisper
faster_whisper:
  model: "small.en"         # Specify the Faster Whisper model size
  device: "auto"           # Options: "auto", "cpu", "cuda"
  compute_type: "auto"  # Options: "auto" "float16", "int8_float16", "int8"
  beam_size: 5             # Beam size for transcription, beam size of 5 is a good default. A higher beam size may improve accuracy but will be slower.
  trim_silence: "true"      # Trim silence from the audio file, useful to make transcriptions even faster


# Whisper x Settings, if you're using WhisperX (Not thoroughly tested yet, but it has speaker labels so the transcript is far more readable)
whisperx:
  model: "small.en"               
  device: "auto"                  # "auto", "cpu", "cuda"
  compute_type: "auto"         # "int8", "int8_float16", ...
  language: "en"                  # "auto", "en", "de", etc.
  batch_size: 1               # Adjust based on GPU memory
  diarize: "true"                 # Enable speaker diarization
  hf_token: "INSERT YOUR HF TOKEN HERE"  # Hugging Face token for pyannote models
  # min_speakers: 2
  # max_speakers: 2
  return_char_alignments: "false"
  highlight_words: "false"
